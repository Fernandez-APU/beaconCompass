<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>System 3: Automated CCTV & Nav Brain</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { --bg: #090d16; --surface: #131b2e; --cyan: #06b6d4; --red: #ef4444; }
        body { margin: 0; background: var(--bg); color: #f1f5f9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 16px; }
        header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .pill { font-size: 0.8rem; padding: 4px 10px; border-radius: 12px; background: #022c22; color: #34d399; }
        
        #cctvFeed { width: 100%; max-width: 400px; height: 220px; background: #000; border-radius: 8px; border: 2px solid var(--surface); margin-bottom: 15px; object-fit: cover; }
        .radar-box { position: relative; width: 300px; height: 300px; border-radius: 50%; border: 2px solid var(--cyan); background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, rgba(9,13,22,0.9) 100%); overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;}
        .arrow-pointer { position: absolute; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 35px solid var(--red); top: 15px; transform-origin: 50% 135px; transition: transform 0.1s ease-out; filter: drop-shadow(0 0 8px var(--red)); }

        .stats { width: 100%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;}
        .card { background: var(--surface); padding: 12px; border-radius: 8px; border: 1px solid #23304b; text-align: center; }
        .label { font-size: 0.75rem; color: #94a3b8; }
        .value { font-size: 1.2rem; font-weight: bold; margin-top: 4px; }
        
        button { background: var(--cyan); color: white; border: none; padding: 15px 20px; border-radius: 8px; font-weight: bold; width: 100%; max-width: 400px; margin-bottom: 10px; cursor: pointer;}
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 800;">SYS 3: NAV BRAIN & CCTV</div>
        <div class="pill" id="mqttStatus">Connecting...</div>
    </header>

    <video id="cctvFeed" autoplay playsinline muted></video>

    <div class="radar-box">
        <div class="arrow-pointer" id="bearingArrow"></div>
    </div>

    <button id="btnInit">INITIALIZE SYSTEM (GRANT PERMISSIONS)</button>

    <div class="stats">
        <div class="card">
            <div class="label">Live Heading</div>
            <div class="value" id="headingVal">0°</div>
        </div>
        <div class="card">
            <div class="label">Target Bearing</div>
            <div class="value" id="bearingVal" style="color: var(--red);">--°</div>
        </div>
        <div class="card">
            <div class="label">Live RSSI</div>
            <div class="value" id="rssiVal">-- dBm</div>
        </div>
        <div class="card">
            <div class="label">State</div>
            <div class="value" id="stateVal" style="color: #94a3b8;">AWAITING INIT</div>
        </div>
    </div>

    <script>
        // Encapsulate all logic to prevent global variable leakage (Rule 6, 9)
        (function() {
            "use strict";

            // --- FIXED BOUNDS & STATE (Rule 2, 3) ---
            const NUM_SECTORS = 36;
            const STATE = {
                heading: 0,
                target: -1,
                sweeping: false,
                targeting: false,
                sectors: new Array(NUM_SECTORS).fill(-120) // Pre-allocated, no dynamic pushing
            };

            let mqttClient = null;

            // --- SAFE DOM UPDATER (Rule 5, 7) ---
            function safeUpdateDOM(elementId, textValue, colorValue) {
                console.assert(elementId !== null && elementId !== "", "safeUpdateDOM: Invalid elementId");
                const el = document.getElementById(elementId);
                if (el !== null) {
                    if (textValue !== null) el.innerText = textValue;
                    if (colorValue !== null) el.style.color = colorValue;
                } else {
                    console.error("DOM element missing: " + elementId);
                }
            }

            // --- MQTT INITIALIZATION ---
            function initMQTT() {
                const clientId = 'Sys3Brain_' + Math.random().toString(16).substr(2, 8);
                mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clientId: clientId });

                mqttClient.on('connect', function() {
                    safeUpdateDOM('mqttStatus', "System Online", null);
                    mqttClient.subscribe('themepark/light/data');
                    mqttClient.subscribe('themepark/wristband/data');
                });

                mqttClient.on('message', handleMqttMessage);
            }

            // --- MESSAGE PARSING & VALIDATION (Rule 4, 8) ---
            function handleMqttMessage(topic, payload) {
                console.assert(topic !== null, "handleMqttMessage: topic is null");
                console.assert(payload !== null, "handleMqttMessage: payload is null");

                if (!payload) return;

                let data = null;
                try {
                    data = JSON.parse(payload.toString());
                } catch (e) {
                    console.error("Invalid JSON payload ignored.");
                    return; // Graceful exit on bad data (Rule 8)
                }

                if (topic === 'themepark/wristband/data') {
                    processWristbandData(data);
                } else if (topic === 'themepark/light/data') {
                    processLightData(data);
                }
            }

            // --- WRISTBAND LOGIC (Rule 4) ---
            function processWristbandData(data) {
                if (typeof data.status !== 'string') return; // Parameter validation (Rule 8)

                if (data.status !== "NORMAL" && !STATE.sweeping && !STATE.targeting) {
                    executeSweep();
                } else if (data.status === "NORMAL" && (STATE.sweeping || STATE.targeting)) {
                    resetSystemState();
                }
            }

            // --- RSSI PROCESSING LOGIC (Rule 4) ---
            function processLightData(data) {
                if (data.rssi === undefined || data.rssi === null) return;

                const rawRssi = parseInt(data.rssi, 10);
                if (isNaN(rawRssi)) return; // Parameter validation (Rule 8)

                safeUpdateDOM('rssiVal', `${rawRssi} dBm`, null);

                if (STATE.sweeping && rawRssi > -95) {
                    const sectorIndex = Math.floor(((STATE.heading + 5) % 360) / 10);
                    console.assert(sectorIndex >= 0 && sectorIndex < NUM_SECTORS, "Sector index out of bounds");
                    
                    if (sectorIndex >= 0 && sectorIndex < NUM_SECTORS) {
                        if (rawRssi > STATE.sectors[sectorIndex]) {
                            STATE.sectors[sectorIndex] = rawRssi;
                        }
                    }
                }
            }

            // --- ACTUATOR CONTROL (Rule 4) ---
            function executeSweep() {
                STATE.sectors.fill(-120);
                STATE.sweeping = true;
                
                safeUpdateDOM('stateVal', "AUTO-SWEEPING", "#ef4444");
                
                if (mqttClient && mqttClient.connected) {
                    mqttClient.publish('themepark/system3/command', '{"motor_command": "SWEEP"}');
                }

                setTimeout(calculateTargetAndTurn, 12000);
            }

            function calculateTargetAndTurn() {
                STATE.sweeping = false;
                let maxVal = -120;
                let peakSector = -1;

                // Bounded loop (Rule 2)
                for (let i = 0; i < NUM_SECTORS; i++) {
                    if (STATE.sectors[i] > maxVal) {
                        maxVal = STATE.sectors[i];
                        peakSector = i;
                    }
                }

                if (peakSector !== -1 && maxVal > -95) {
                    STATE.target = peakSector * 10;
                    safeUpdateDOM('bearingVal', `${STATE.target}°`, null);
                    safeUpdateDOM('stateVal', "TARGETING", null);
                    
                    const diff = (STATE.target - STATE.heading + 360) % 360;
                    const command = (diff > 180) ? "TURN_LEFT" : "TURN_RIGHT";
                    
                    STATE.targeting = true;
                    if (mqttClient && mqttClient.connected) {
                        mqttClient.publish('themepark/system3/command', `{"motor_command": "${command}"}`);
                    }
                } else {
                    safeUpdateDOM('stateVal', "NO SIGNAL", null);
                    if (mqttClient && mqttClient.connected) {
                        mqttClient.publish('themepark/system3/command', '{"motor_command": "STOP"}');
                    }
                    setTimeout(resetSystemState, 5000);
                }
            }

            function resetSystemState() {
                STATE.sweeping = false;
                STATE.targeting = false;
                STATE.target = -1;
                safeUpdateDOM('bearingVal', "--°", null);
                safeUpdateDOM('stateVal', "STANDBY", "#34d399");
            }

            // --- HARDWARE SENSORS ---
            function handleOrientation(e) {
                console.assert(e !== null, "handleOrientation: event is null");
                
                let compass = 0;
                if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
                    compass = e.webkitCompassHeading;
                } else if (e.alpha !== null) {
                    compass = (360 - e.alpha) % 360;
                } 

                STATE.heading = Math.round(compass);
                safeUpdateDOM('headingVal', `${STATE.heading}°`, null);

                if (STATE.target !== -1) {
                    const relativeAngle = (STATE.target - STATE.heading + 360) % 360;
                    const arrowEl = document.getElementById('bearingArrow');
                    if (arrowEl !== null) arrowEl.style.transform = `rotate(${relativeAngle}deg)`;

                    if (STATE.targeting) {
                        let offTarget = Math.abs(STATE.heading - STATE.target);
                        if (offTarget > 180) offTarget = 360 - offTarget;
                        
                        if (offTarget <= 3) {
                            STATE.targeting = false;
                            safeUpdateDOM('stateVal', "LOCKED", null);
                            if (mqttClient && mqttClient.connected) {
                                mqttClient.publish('themepark/system3/command', '{"motor_command": "STOP"}');
                            }
                        }
                    }
                }
            }

            async function initializeHardware() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    const videoEl = document.getElementById('cctvFeed');
                    if (videoEl !== null) videoEl.srcObject = stream;
                } catch (err) { 
                    console.error("Camera denied", err); 
                }

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                        }
                    }).catch(console.error);
                } else {
                    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }

                const btn = document.getElementById('btnInit');
                if (btn !== null) btn.style.display = 'none';
                
                safeUpdateDOM('stateVal', "STANDBY", "#34d399");
                initMQTT();
            }

            // Event Listener Binding
            const initButton = document.getElementById('btnInit');
            console.assert(initButton !== null, "Init button missing from DOM");
            if (initButton !== null) {
                initButton.addEventListener('click', initializeHardware);
            }

        })();
    </script>
</body>
</html>
