<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>System 3: 6-Sector CCTV Radar</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { --bg: #090d16; --surface: #131b2e; --cyan: #06b6d4; --red: #ef4444; --green: #10b981; }
        body { margin: 0; background: var(--bg); color: #f1f5f9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 12px; }
        header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .pill { font-size: 0.8rem; padding: 4px 10px; border-radius: 12px; background: #022c22; color: #34d399; }
        
        #cctvFeed { width: 100%; max-width: 400px; height: 200px; background: #000; border-radius: 8px; border: 2px solid var(--surface); margin-bottom: 10px; object-fit: cover; }

        .radar-container { position: relative; width: 280px; height: 280px; margin-bottom: 12px; }
        svg.radar-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .sector-slice { fill: rgba(6, 182, 212, 0.08); stroke: rgba(6, 182, 212, 0.35); stroke-width: 1.5; transition: fill 0.2s; }
        .sector-slice.active { fill: rgba(239, 68, 68, 0.45); stroke: var(--red); }
        .sector-slice.best { fill: rgba(16, 185, 129, 0.45); stroke: var(--green); }

        .arrow-pointer { position: absolute; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 34px solid var(--red); top: 20px; left: 131px; transform-origin: 50% 120px; transition: transform 0.15s ease-out; filter: drop-shadow(0 0 8px var(--red)); display: none; }

        .stats { width: 100%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;}
        .card { background: var(--surface); padding: 8px; border-radius: 8px; border: 1px solid #23304b; text-align: center; }
        .label { font-size: 0.72rem; color: #94a3b8; }
        .value { font-size: 1.15rem; font-weight: bold; margin-top: 2px; }
        
        button { background: var(--cyan); color: white; border: none; padding: 14px 18px; border-radius: 8px; font-weight: bold; width: 100%; max-width: 400px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 800;">SYS 3: CCTV 6-SECTOR RADAR</div>
        <div class="pill" id="mqttStatus">Connecting...</div>
    </header>

    <video id="cctvFeed" autoplay playsinline muted></video>

    <div class="radar-container">
        <svg class="radar-svg" viewBox="-100 -100 200 200" id="radarSvg">
            <!-- 6 Sectors: 60 deg each -->
            <path id="sec0" class="sector-slice" d="M 0 0 L 95 0 A 95 95 0 0 1 47.5 82.27 Z" />
            <path id="sec1" class="sector-slice" d="M 0 0 L 47.5 82.27 A 95 95 0 0 1 -47.5 82.27 Z" />
            <path id="sec2" class="sector-slice" d="M 0 0 L -47.5 82.27 A 95 95 0 0 1 -95 0 Z" />
            <path id="sec3" class="sector-slice" d="M 0 0 L -95 0 A 95 95 0 0 1 -47.5 -82.27 Z" />
            <path id="sec4" class="sector-slice" d="M 0 0 L -47.5 -82.27 A 95 95 0 0 1 47.5 -82.27 Z" />
            <path id="sec5" class="sector-slice" d="M 0 0 L 47.5 -82.27 A 95 95 0 0 1 95 0 Z" />
        </svg>
        <div class="arrow-pointer" id="bearingArrow"></div>
    </div>

    <button id="btnInit">START CCTV & ORIENTATION</button>

    <div class="stats">
        <div class="card">
            <div class="label">Live Heading</div>
            <div class="value" id="headingVal">0°</div>
        </div>
        <div class="card">
            <div class="label">Active Sector</div>
            <div class="value" id="activeSecVal" style="color: var(--cyan);">STANDBY</div>
        </div>
        <div class="card">
            <div class="label">Locked Bearing</div>
            <div class="value" id="bearingVal" style="color: var(--green);">--°</div>
        </div>
        <div class="card">
            <div class="label">Average RSSI</div>
            <div class="value" id="rssiVal">-- dBm</div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            var currentHeading = 0;
            var lockedBearing = -1;
            var activeRecordingSector = -1;
            var mqttClient = null;

            var arrowEl = document.getElementById('bearingArrow');
            var activeSecValEl = document.getElementById('activeSecVal');
            var headingValEl = document.getElementById('headingVal');
            var bearingValEl = document.getElementById('bearingVal');
            var rssiValEl = document.getElementById('rssiVal');
            var mqttStatusEl = document.getElementById('mqttStatus');

            function highlightSector(sectorIdx, className) {
                for (var i = 0; i < 6; i++) {
                    var el = document.getElementById('sec' + i);
                    if (el) {
                        el.classList.remove('active');
                        if (className !== 'best') el.classList.remove('best');
                    }
                }
                if (sectorIdx >= 0 && sectorIdx < 6) {
                    var target = document.getElementById('sec' + sectorIdx);
                    if (target) target.classList.add(className);
                }
            }

            function initMQTT() {
                var clientId = 'Sys3UI_' + Math.random().toString(16).substr(2, 8);
                mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clientId: clientId });

                mqttClient.on('connect', function() {
                    if (mqttStatusEl) mqttStatusEl.innerText = "Online";
                    mqttClient.subscribe('themepark/light/data');
                    mqttClient.subscribe('themepark/wristband/data');
                });

                mqttClient.on('message', handleMqttPayload);
            }

            function handleMqttPayload(topic, payload) {
                console.assert(topic !== null, "MQTT topic is null");
                console.assert(payload !== null, "MQTT payload is null");

                var data = null;
                try {
                    data = JSON.parse(payload.toString());
                } catch(e) { return; }

                if (topic === 'themepark/wristband/data') {
                    if (data.status === "NORMAL") {
                        activeRecordingSector = -1;
                        lockedBearing = -1;
                        highlightSector(-1, '');
                        if (arrowEl) arrowEl.style.display = 'none';
                        if (activeSecValEl) activeSecValEl.innerText = "STANDBY";
                        if (bearingValEl) bearingValEl.innerText = "--°";
                        if (rssiValEl) rssiValEl.innerText = "-- dBm";
                    }
                } else if (topic === 'themepark/light/data') {
                    if (data.state === "RECORDING") {
                        activeRecordingSector = parseInt(data.recordingSector, 10);
                        highlightSector(activeRecordingSector, 'active');
                        if (activeSecValEl) {
                            activeSecValEl.innerText = "Sec " + activeRecordingSector + " (" + data.centerDeg + "°)";
                        }
                        // Verify phone compass is inside this 60° section before initiating sample
                        verifyAndConfirmSector(activeRecordingSector);
                    } else if (data.state === "LOCKED") {
                        lockedBearing = parseInt(data.bestBearing, 10);
                        var bestSec = Math.floor(lockedBearing / 60) % 6;
                        highlightSector(bestSec, 'best');

                        if (bearingValEl) bearingValEl.innerText = lockedBearing + "°";
                        if (rssiValEl) rssiValEl.innerText = data.rssi + " dBm";
                        if (activeSecValEl) activeSecValEl.innerText = "LOCKED";

                        // Reveal or update pointer now that all 6 directions are averaged
                        if (arrowEl) {
                            arrowEl.style.display = 'block';
                            updatePointer();
                        }
                    }
                }
            }

            function verifyAndConfirmSector(secIdx) {
                var minAngle = secIdx * 60;
                var maxAngle = minAngle + 60;
                var inSection = false;

                if (secIdx === 0) {
                    inSection = (currentHeading >= 0 && currentHeading <= 60) || (currentHeading >= 350);
                } else {
                    inSection = (currentHeading >= (minAngle - 10) && currentHeading <= (maxAngle + 10));
                }

                // If orientation aligns or within safe margin, transmit sample command
                if (inSection && mqttClient && mqttClient.connected) {
                    mqttClient.publish('themepark/system3/command', '{"command":"START_SAMPLE"}');
                }
            }

            function handleOrientation(e) {
                var compass = 0;
                if (e.webkitCompassHeading !== undefined) {
                    compass = e.webkitCompassHeading;
                } else if (e.alpha !== null) {
                    compass = (360 - e.alpha) % 360;
                }

                currentHeading = Math.round(compass);
                if (headingValEl) headingValEl.innerText = currentHeading + "°";

                // Needle stays pointing at last locked target during sweeps
                if (lockedBearing !== -1) {
                    updatePointer();
                }
            }

            function updatePointer() {
                if (arrowEl && lockedBearing !== -1) {
                    var relAngle = (lockedBearing - currentHeading + 360) % 360;
                    arrowEl.style.transform = "rotate(" + relAngle + "deg)";
                }
            }

            async function initialize() {
                try {
                    var stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                    var vid = document.getElementById('cctvFeed');
                    if (vid) vid.srcObject = stream;
                } catch(err) {
                    console.error("CCTV stream failed", err);
                }

                if (typeof DeviceOrientationEvent !== 'undefined' &&
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(function(res) {
                        if (res === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                        }
                    }).catch(console.error);
                } else {
                    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }

                var btn = document.getElementById('btnInit');
                if (btn) btn.style.display = 'none';

                initMQTT();
            }

            var initBtn = document.getElementById('btnInit');
            if (initBtn) initBtn.addEventListener('click', initialize);
        })();
    </script>
</body>
</html>
