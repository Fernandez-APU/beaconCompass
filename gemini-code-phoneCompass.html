<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>360° Security Radar</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { --bg: #090d16; --surface: #131b2e; --cyan: #06b6d4; --red: #ef4444; }
        body { margin: 0; background: var(--bg); color: #f1f5f9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 16px; }
        header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .pill { font-size: 0.8rem; padding: 4px 10px; border-radius: 12px; background: #022c22; color: #34d399; }
        
        .radar-box { position: relative; width: 300px; height: 300px; border-radius: 50%; border: 2px solid var(--cyan); background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, rgba(9,13,22,0.9) 100%); overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;}
        .ring { position: absolute; border: 1px dashed rgba(6,182,212,0.3); border-radius: 50%; }
        .cross-h { position: absolute; width: 100%; height: 1px; background: rgba(6,182,212,0.2); }
        .cross-v { position: absolute; height: 100%; width: 1px; background: rgba(6,182,212,0.2); }
        
        .arrow-pointer { position: absolute; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 35px solid var(--red); top: 15px; transform-origin: 50% 135px; transition: transform 0.2s ease-out; filter: drop-shadow(0 0 8px var(--red)); }

        .stats { width: 100%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;}
        .card { background: var(--surface); padding: 12px; border-radius: 8px; border: 1px solid #23304b; text-align: center; }
        .label { font-size: 0.75rem; color: #94a3b8; }
        .value { font-size: 1.2rem; font-weight: bold; margin-top: 4px; }
        
        button { background: var(--red); color: white; border: none; padding: 15px 20px; border-radius: 8px; font-weight: bold; width: 100%; max-width: 400px; margin-bottom: 10px;}
        .btn-cyan { background: var(--cyan); }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 800;">360° RADAR</div>
        <div class="pill" id="mqttStatus">Connecting...</div>
    </header>

    <div class="radar-box">
        <div class="ring" style="width: 100px; height: 100px;"></div>
        <div class="ring" style="width: 200px; height: 200px;"></div>
        <div class="cross-h"></div>
        <div class="cross-v"></div>
        <div class="arrow-pointer" id="bearingArrow"></div>
    </div>

    <button class="btn-cyan" id="btnPerm" onclick="requestCompass()">Calibrate Compass</button>
    <button onclick="cancelAlarm()">CANCEL ALARM (DISARM)</button>

    <div class="stats">
        <div class="card">
            <div class="label">Facing Heading</div>
            <div class="value" id="headingVal">0°</div>
        </div>
        <div class="card">
            <div class="label">Target Bearing</div>
            <div class="value" id="bearingVal" style="color: var(--red);">--°</div>
        </div>
        <div class="card">
            <div class="label">Live Signal (RSSI)</div>
            <div class="value" id="rssiVal">-- dBm</div>
        </div>
        <div class="card">
            <div class="label">Est. Distance</div>
            <div class="value" id="distVal" style="color: var(--cyan);">-- m</div>
        </div>
    </div>

    <script>
        let currentHeading = 0;
        let bestBearing = 0;
        
        // 36 Bins (10° resolution) with Timestamp Peak-Hold Decay
        const NUM_SECTORS = 36;
        const PEAK_TIMEOUT_MS = 5000; // Forget lost signals after 5 seconds
        const sectors = new Array(NUM_SECTORS).fill(null).map(() => ({ rssi: -120, lastSeen: 0 }));

        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clientId: 'PhoneRadar_' + Math.random().toString(16).substr(2, 8) });

        client.on('connect', () => {
            document.getElementById('mqttStatus').innerText = "System Online";
            client.subscribe('themepark/security/data');
        });

        client.on('message', (topic, payload) => {
            try {
                const data = JSON.parse(payload.toString());
                const rawRssi = data.rssi;
                
                if(rawRssi && data.dist) {
                    document.getElementById('rssiVal').innerText = `${rawRssi} dBm`;
                    document.getElementById('distVal').innerText = `${data.dist} m`;

                    if (rawRssi > -95) {
                        // Bin the incoming signal into a 10° sector based on current phone heading
                        const sectorIndex = Math.floor(((currentHeading + 5) % 360) / 10);
                        sectors[sectorIndex].rssi = rawRssi;
                        sectors[sectorIndex].lastSeen = Date.now();

                        let currentBestRSSI = -120;
                        let peakSectorIndex = -1;
                        let now = Date.now();

                        // Decay old signals and find the true current peak
                        for (let i = 0; i < NUM_SECTORS; i++) {
                            if (now - sectors[i].lastSeen > PEAK_TIMEOUT_MS) {
                                sectors[i].rssi = -120; // Signal is stale, clear it
                            }
                            if (sectors[i].rssi > currentBestRSSI) {
                                currentBestRSSI = sectors[i].rssi;
                                peakSectorIndex = i;
                            }
                        }

                        if (peakSectorIndex !== -1 && currentBestRSSI > -95) {
                            bestBearing = peakSectorIndex * 10;
                            document.getElementById('bearingVal').innerText = `${bestBearing}°`;
                            updateArrow();
                        }
                    }
                }
            } catch (e) { console.error("Payload error", e); }
        });

        function cancelAlarm() {
            client.publish('themepark/wristband/control', '{"command":"CANCEL_SOS"}');
            document.getElementById('bearingVal').innerText = `--°`;
            document.getElementById('distVal').innerText = `-- m`;
        }

        function updateArrow() {
            const relativeAngle = (bestBearing - currentHeading + 360) % 360;
            document.getElementById('bearingArrow').style.transform = `rotate(${relativeAngle}deg)`;
        }

        function requestCompass() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        document.getElementById('btnPerm').style.display = 'none';
                    }
                }).catch(console.error);
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
                document.getElementById('btnPerm').style.display = 'none';
            }
        }

        function handleOrientation(e) {
            let compass = 0;
            if (e.webkitCompassHeading) compass = e.webkitCompassHeading;
            else if (e.alpha !== null) compass = (360 - e.alpha) % 360; 

            currentHeading = Math.round(compass);
            document.getElementById('headingVal').innerText = `${currentHeading}°`;
            updateArrow();
        }
    </script>
</body>
</html>
