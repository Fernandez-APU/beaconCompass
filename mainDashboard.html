<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Park Command Center</title>
    <!-- MQTT.js Library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* Minimalist Greyscale Theme matching your image */
        :root {
            --bg-color: #d4d4d8; /* Light grey map background */
            --taskbar-bg: #27272a; /* Dark grey sidebar */
            --taskbar-text: #e4e4e7;
            --border-color: #a1a1aa;
            --sys1-red: #ef4444;
            --sys2-green: #22c55e;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f4f4f5;
            overflow: hidden;
        }

        /* --- Collapsible Taskbar --- */
        nav.taskbar {
            width: 60px;
            background-color: var(--taskbar-bg);
            color: var(--taskbar-text);
            transition: width 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            z-index: 10;
        }

        nav.taskbar.expanded { width: 220px; }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            padding: 15px;
            cursor: pointer;
            text-align: left;
            outline: none;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 15px;
            white-space: nowrap;
            border-bottom: 1px solid #3f3f46;
        }

        .nav-icon { font-weight: 900; font-size: 16px; min-width: 30px; }
        .nav-label { opacity: 0; transition: opacity 0.3s ease; margin-left: 5px; font-size: 14px; }
        nav.taskbar.expanded .nav-label { opacity: 1; }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #52525b; /* Offline grey */
            margin-left: auto;
            transition: background 0.3s;
        }

        /* --- Main Map Area --- */
        main {
            flex: 1;
            position: relative;
            background: repeating-linear-gradient(45deg, #e4e4e7, #e4e4e7 10px, #f4f4f5 10px, #f4f4f5 20px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .map-box {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color); 
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .map-title {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #52525b;
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 1.5px;
        }

        /* --- Fixed Trackers --- */
        .tracker {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            transition: opacity 0.3s;
        }

        /* System 1: Victim (Blinks Red on Warning) */
        #victim-dot {
            top: 35%;
            left: 25%;
            background-color: var(--sys1-red);
            opacity: 0; /* Hidden by default until emergency */
        }
        
        .emergency-active {
            opacity: 1 !important;
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); transform: translate(-50%, -50%) scale(1); }
            100% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); transform: translate(-50%, -50%) scale(1.2); }
        }

        /* System 2: Security (Solid Green, fixed random spot) */
        #security-dot {
            top: 65%;
            left: 75%;
            background-color: var(--sys2-green);
            opacity: 1; /* Always visible */
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }
    </style>
</head>
<body>

    <!-- Taskbar -->
    <nav class="taskbar" id="sidebar">
        <button class="menu-btn" onclick="toggleTaskbar()">☰</button>
        <div class="nav-item">
            <span class="nav-icon">P</span><span class="nav-label">People (Sys 1)</span>
            <div class="status-dot" id="dot-sys1"></div>
        </div>
        <div class="nav-item">
            <span class="nav-icon">S</span><span class="nav-label">Security (Sys 2)</span>
            <div class="status-dot" id="dot-sys2"></div>
        </div>
        <div class="nav-item">
            <span class="nav-icon">L</span><span class="nav-label">Light (Sys 3)</span>
            <div class="status-dot" id="dot-sys3"></div>
        </div>
        <div class="nav-item">
            <span class="nav-icon">B</span><span class="nav-label">Border (Sys 4)</span>
            <div class="status-dot" id="dot-sys4"></div>
        </div>
    </nav>

    <!-- Main Map Screen -->
    <main>
        <div class="map-box">
            <div class="map-title">THEME PARK MAP [IMG PLACEHOLDER]</div>
            <div id="victim-dot" class="tracker">V</div>
            <div id="security-dot" class="tracker">S</div>
        </div>
    </main>

    <script>
        // --- UI Logic ---
        function toggleTaskbar() {
            document.getElementById('sidebar').classList.toggle('expanded');
        }

        // --- Multi-Host MQTT Connection Manager ---
        function createMqttClient(config) {
            const clientId = 'Web_' + config.id + '_' + Math.random().toString(16).substr(2, 8);
            const client = mqtt.connect(config.host, { clientId: clientId, keepalive: 30 });

            client.on('connect', () => {
                console.log(config.name + " Connected to " + config.host);
                document.getElementById(config.dotId).style.background = "#22c55e"; // Taskbar dot turns Green
                client.subscribe(config.topic);
            });

            client.on('message', (topic, payload) => {
                if (config.onMessage) config.onMessage(JSON.parse(payload.toString()));
            });

            client.on('offline', () => {
                document.getElementById(config.dotId).style.background = "#ef4444"; // Taskbar dot turns Red on disconnect
            });

            return client;
        }

        // --- Initialize 4 Completely Independent MQTT Clients Automatically ---
        window.onload = function() {
            // 1. System 1 (People)
            createMqttClient({
                id: 'sys1', name: 'People', host: 'wss://broker.hivemq.com:8884/mqtt', topic: 'themepark/wristband/data', dotId: 'dot-sys1',
                onMessage: function(data) {
                    const vDot = document.getElementById('victim-dot');
                    // Blinks red ONLY if warning
                    if (data.status === "MANUAL_SOS" || data.status === "DROWNING_HYPOXIA" || data.status === "TAMPER_REMOVED") {
                        vDot.classList.add('emergency-active');
                    } else {
                        vDot.classList.remove('emergency-active');
                    }
                }
            });

            // 2. System 2 (Security)
            createMqttClient({
                id: 'sys2', name: 'Security', host: 'wss://broker.hivemq.com:8884/mqtt', topic: 'themepark/security/data', dotId: 'dot-sys2',
                onMessage: function(data) {
                    // Coordinates remain fixed for now as requested.
                }
            });

            // 3. System 3 (Light - Future Concept on different host)
            createMqttClient({
                id: 'sys3', name: 'Light', host: 'wss://test.mosquitto.org:8081/mqtt', topic: 'themepark/light/data', dotId: 'dot-sys3'
            });

            // 4. System 4 (Border - Future Concept on different host)
            createMqttClient({
                id: 'sys4', name: 'Border', host: 'wss://mqtt.eclipseprojects.io:443/mqtt', topic: 'themepark/border/data', dotId: 'dot-sys4'
            });
        };
    </script>
</body>
</html>
